<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neighborhood Coffee Spots</title>
<style>
  :root{
    --ink:#2b2118;
    --ink2:#6f5d4c;
    --paper:#faf5ec;
    --card:#fffdf7;
    --line:#e3d7c3;
    --accent:#b5502a;
    --accent-soft:#f3e3d3;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:clip;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:430px;margin:0 auto;padding:20px 16px 40px;}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em;}
  .sub{color:var(--ink2);font-size:15px;margin:0 0 18px;line-height:1.45;}

  /* readout: selection is applied in place, directly above the carousel */
  .readout{
    border:1px solid var(--accent);
    background:var(--accent-soft);
    border-radius:12px;
    padding:12px 16px;
    font-size:16px;
    margin:0 0 16px;
    min-height:48px;
  }
  .readout .lab{
    display:block;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:2px;
  }
  .readout .name{font-weight:700;font-size:18px;}

  /* ---- carousel (skill pattern) ---- */
  .tcar{position:relative;padding:0 30px;}
  .ttrack{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    overscroll-behavior-x:contain;
    border-radius:16px;
  }
  .ttrack::-webkit-scrollbar{display:none;}
  .tslide{
    flex:0 0 100%;
    scroll-snap-align:center;
    scroll-snap-stop:always;
  }
  .tslide-card{
    display:block;
    width:100%;
    text-align:left;
    font:inherit;
    color:inherit;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 20px 18px;
    cursor:pointer;
    touch-action:manipulation;
    box-shadow:0 1px 3px rgba(60,40,20,.08);
  }
  .tslide-card.sel{border-color:var(--accent);border-width:2px;padding:19px 19px 17px;}
  .tslide-card .spot-name{display:block;font-size:21px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px;}
  .tslide-card .hood{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
  .tslide-card .note{display:block;font-size:15px;line-height:1.5;color:var(--ink2);margin-bottom:14px;}
  .tslide-card .meta{display:flex;gap:8px;flex-wrap:wrap;}
  .tslide-card .chip{
    display:inline-block;
    font-size:13px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:999px;
    padding:4px 10px;
  }
  .tcount{
    text-align:center;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-variant-numeric:tabular-nums;
    font-size:13px;
    color:var(--ink2);
    margin:10px 0 0;
  }
  .tnav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,253,247,.85);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    box-shadow:0 2px 8px rgba(60,40,20,.18);
    color:var(--ink);
    font-size:24px;
    line-height:1;
    cursor:pointer;
    touch-action:manipulation;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 0 3px;
    z-index:2;
  }
  .tnav.prev{left:0;}
  .tnav.next{right:0;}
  .hint{color:var(--ink2);font-size:13.5px;text-align:center;margin:14px 0 0;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Neighborhood coffee spots</h1>
    <p class="sub">Five local favorites, one at a time. Swipe or use the arrows, and tap a card to select it.</p>

    <p class="readout" aria-live="polite">
      <span class="lab">Selected spot</span>
      <span class="name" id="readoutName">Juniper &amp; Rye</span>
    </p>

    <div class="tcar">
      <div class="ttrack" id="ttrack" aria-label="Coffee spots"></div>
      <button class="tnav prev" id="tprev" type="button" aria-label="Previous">&#8249;</button>
      <button class="tnav next" id="tnext" type="button" aria-label="Next">&#8250;</button>
    </div>

    <p class="hint">Tap a card to select it. Selecting never moves the page.</p>
  </div>

<script>
(function(){
  "use strict";

  var SPOTS = [
    { name: "Juniper & Rye", hood: "Maplewood",
      note: "Tiny corner spot with a juniper latte that sounds like a gimmick and is not. Six tables, one long communal bench, and the best cardamom bun in the neighborhood.",
      chips: ["★ 4.8", "$$", "Oat milk everything"] },
    { name: "The Daily Grindhouse", hood: "Old Town",
      note: "A former print shop turned espresso bar. Fast, loud, and friendly, with a standing bar for people who have exactly nine minutes before the train.",
      chips: ["★ 4.6", "$", "Standing bar"] },
    { name: "Copper Kettle Coffee", hood: "Riverside",
      note: "Slow mornings done right: pour-overs brewed to order, river-facing window seats, and a no-laptops-after-noon rule on weekends that regulars defend fiercely.",
      chips: ["★ 4.9", "$$", "Pour-over bar"] },
    { name: "Night Owl Espresso", hood: "University District",
      note: "Open until 2 AM during term time. Decaf that actually tastes like coffee, bottomless drip for students, and a chalkboard of rotating single-origin shots.",
      chips: ["★ 4.5", "$", "Open late"] },
    { name: "Santo Domingo Cafe", hood: "Mercado District",
      note: "Family-run for twenty years. Cafe de olla on the stove all day, conchas from the bakery next door, and cortados pulled short and strong.",
      chips: ["★ 4.7", "$", "Cafe de olla"] }
  ];

  var track = document.getElementById('ttrack');
  var readoutName = document.getElementById('readoutName');
  var prev = document.getElementById('tprev');
  var next = document.getElementById('tnext');
  var idx = 0;
  var n = SPOTS.length;

  SPOTS.forEach(function(spot, i){
    var slide = document.createElement('div');
    slide.className = 'tslide';
    var chips = spot.chips.map(function(c){ return '<span class="chip">' + c + '</span>'; }).join('');
    slide.innerHTML =
      '<button class="tslide-card" type="button" aria-label="Select ' + spot.name + '">' +
        '<span class="spot-name">' + spot.name + '</span>' +
        '<span class="hood">' + spot.hood + '</span>' +
        '<span class="note">' + spot.note + '</span>' +
        '<span class="meta">' + chips + '</span>' +
      '</button>' +
      '<p class="tcount">' + (i + 1) + '/' + n + '</p>';
    slide.querySelector('.tslide-card').addEventListener('click', function(){ load(i); });
    track.appendChild(slide);
  });
  var cards = Array.prototype.slice.call(track.querySelectorAll('.tslide-card'));

  /* Rule 2: every card the same height, re-measured on render and resize. */
  function equalize(){
    cards.forEach(function(c){ c.style.height = 'auto'; });
    var max = 0;
    cards.forEach(function(c){ if (c.offsetHeight > max) max = c.offsetHeight; });
    cards.forEach(function(c){ c.style.height = max + 'px'; });
  }

  function applySelection(){
    readoutName.textContent = SPOTS[idx].name;
    cards.forEach(function(c, j){ c.classList.toggle('sel', j === idx); });
  }

  /* Skill controller: wrap the index, apply in place, instant scrollTo. */
  function load(i){
    idx = ((i % n) + n) % n;
    applySelection();
    track.scrollTo(idx * track.clientWidth, 0);
  }

  prev.addEventListener('click', function(){ load(idx - 1); });
  next.addEventListener('click', function(){ load(idx + 1); });

  /* Track scroll updates idx, rAF-throttled. */
  var ticking = false;
  track.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      var i = Math.round(track.scrollLeft / track.clientWidth);
      if (i !== idx && i >= 0 && i < n){ idx = i; applySelection(); }
      scheduleSettle();
    });
  }, { passive: true });

  /* iOS backstop: once scrolling stops, snap to the nearest slide if off by >2px. */
  var settleT = 0;
  function settle(){
    var target = idx * track.clientWidth;
    if (Math.abs(track.scrollLeft - target) > 2) track.scrollTo(target, 0);
  }
  function scheduleSettle(){
    clearTimeout(settleT);
    settleT = setTimeout(settle, 180);
  }
  if ('onscrollend' in window) track.addEventListener('scrollend', settle);

  var resizeT = 0;
  window.addEventListener('resize', function(){
    clearTimeout(resizeT);
    resizeT = setTimeout(function(){ equalize(); track.scrollTo(idx * track.clientWidth, 0); }, 150);
  });

  equalize();
  load(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(equalize);
})();
</script>
</body>
</html>
