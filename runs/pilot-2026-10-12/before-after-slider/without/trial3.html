<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Before / After Comparison Slider</title>
  <style>
    :root {
      color-scheme: light;
      --pos: 50%;
      --ink: #17202a;
      --panel: #ffffff;
      --line: rgba(23, 32, 42, 0.16);
      --accent: #1464d2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef1f4;
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(960px, 100%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: #4a5568;
      line-height: 1.55;
    }

    .compare {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #d7dee6;
      box-shadow: 0 22px 55px rgba(23, 32, 42, 0.18);
      user-select: none;
      touch-action: none;
    }

    .layer,
    .layer svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .layer svg {
      display: block;
    }

    .before {
      z-index: 2;
      clip-path: inset(0 calc(100% - var(--pos)) 0 0);
    }

    .after {
      z-index: 1;
    }

    .label {
      position: absolute;
      z-index: 5;
      top: 14px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(12, 18, 26, 0.72);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }

    .label.before-label { left: 14px; }
    .label.after-label { right: 14px; }

    .divider {
      position: absolute;
      z-index: 6;
      top: 0;
      bottom: 0;
      left: var(--pos);
      width: 2px;
      transform: translateX(-1px);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 0 0 1px rgba(12, 18, 26, 0.18), 0 0 22px rgba(12, 18, 26, 0.28);
      pointer-events: none;
    }

    .handle {
      position: absolute;
      z-index: 7;
      top: 50%;
      left: var(--pos);
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(12, 18, 26, 0.14);
      border-radius: 50%;
      background: var(--panel);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: ew-resize;
      box-shadow: 0 10px 28px rgba(12, 18, 26, 0.28);
    }

    .handle::before,
    .handle::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 9px;
      height: 9px;
      border-top: 2px solid currentColor;
      border-left: 2px solid currentColor;
    }

    .handle::before {
      left: 12px;
      transform: translateY(-50%) rotate(-45deg);
    }

    .handle::after {
      right: 12px;
      transform: translateY(-50%) rotate(135deg);
    }

    .handle:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 12px;
      color: #4a5568;
      font-size: 0.92rem;
    }

    .value {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--ink);
    }

    @media (max-width: 560px) {
      body { padding: 14px; }
      .compare { aspect-ratio: 4 / 3; }
      .handle { width: 46px; height: 46px; }
      .meta { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Before / after</h1>
    <p>Drag the divider, click anywhere on the image, or focus the handle and use the arrow keys.</p>

    <section class="compare" id="compare" aria-label="Photo comparison slider">
      <div class="layer after" aria-hidden="true">
        <svg viewBox="0 0 960 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Edited color landscape">
          <defs>
            <linearGradient id="afterSky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#42a5f5"/>
              <stop offset="0.55" stop-color="#90caf9"/>
              <stop offset="1" stop-color="#fff3c4"/>
            </linearGradient>
            <linearGradient id="afterLake" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4fc3f7"/>
              <stop offset="1" stop-color="#1565c0"/>
            </linearGradient>
            <linearGradient id="afterHill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#43a047"/>
              <stop offset="1" stop-color="#1b5e20"/>
            </linearGradient>
          </defs>
          <rect width="960" height="600" fill="url(#afterSky)"/>
          <circle cx="760" cy="112" r="54" fill="#ffd54f"/>
          <path d="M0 386 L190 218 L338 342 L492 188 L664 374 L812 250 L960 392 L960 600 L0 600 Z" fill="#5d7f95"/>
          <path d="M0 420 L238 268 L430 414 L610 282 L960 452 L960 600 L0 600 Z" fill="url(#afterHill)"/>
          <path d="M0 486 C170 452 292 514 470 486 C650 458 770 516 960 480 L960 600 L0 600 Z" fill="url(#afterLake)"/>
          <path d="M94 500 C220 478 330 502 470 492" fill="none" stroke="#e1f5fe" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
          <path d="M540 536 C660 516 770 540 900 524" fill="none" stroke="#bbdefb" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
          <g fill="#2e7d32">
            <path d="M116 420 l22 -58 l22 58 h-14 l18 34 h-48 l18 -34 z"/>
            <path d="M806 424 l24 -66 l24 66 h-15 l20 38 h-54 l20 -38 z"/>
            <path d="M690 452 l18 -48 l18 48 h-11 l15 28 h-40 l15 -28 z"/>
          </g>
        </svg>
      </div>

      <div class="layer before" aria-hidden="true">
        <svg viewBox="0 0 960 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Unedited muted landscape">
          <defs>
            <linearGradient id="beforeSky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#9aa5ad"/>
              <stop offset="0.55" stop-color="#c3c9cc"/>
              <stop offset="1" stop-color="#e3ded0"/>
            </linearGradient>
            <linearGradient id="beforeLake" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#9fb3ba"/>
              <stop offset="1" stop-color="#607d8b"/>
            </linearGradient>
            <linearGradient id="beforeHill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7d8b74"/>
              <stop offset="1" stop-color="#46584a"/>
            </linearGradient>
          </defs>
          <rect width="960" height="600" fill="url(#beforeSky)"/>
          <circle cx="760" cy="112" r="54" fill="#d8cf9f"/>
          <path d="M0 386 L190 218 L338 342 L492 188 L664 374 L812 250 L960 392 L960 600 L0 600 Z" fill="#75828a"/>
          <path d="M0 420 L238 268 L430 414 L610 282 L960 452 L960 600 L0 600 Z" fill="url(#beforeHill)"/>
          <path d="M0 486 C170 452 292 514 470 486 C650 458 770 516 960 480 L960 600 L0 600 Z" fill="url(#beforeLake)"/>
          <path d="M94 500 C220 478 330 502 470 492" fill="none" stroke="#e6eeee" stroke-width="7" stroke-linecap="round" opacity="0.62"/>
          <path d="M540 536 C660 516 770 540 900 524" fill="none" stroke="#cfd8dc" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
          <g fill="#54655a">
            <path d="M116 420 l22 -58 l22 58 h-14 l18 34 h-48 l18 -34 z"/>
            <path d="M806 424 l24 -66 l24 66 h-15 l20 38 h-54 l20 -38 z"/>
            <path d="M690 452 l18 -48 l18 48 h-11 l15 28 h-40 l15 -28 z"/>
          </g>
        </svg>
      </div>

      <span class="label before-label">Unedited</span>
      <span class="label after-label">Edited</span>
      <div class="divider" aria-hidden="true"></div>
      <div class="handle" id="handle" role="slider" tabindex="0" aria-label="Comparison divider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50 percent edited image visible"></div>
    </section>

    <div class="meta" aria-hidden="true">
      <span>Keyboard: Left / Right arrows, Home, End</span>
      <span>Edited visible: <span class="value" id="value">50%</span></span>
    </div>
  </main>

  <script>
    (() => {
      const compare = document.getElementById('compare');
      const handle = document.getElementById('handle');
      const value = document.getElementById('value');
      let position = 50;
      let dragging = false;

      const clamp = (number) => Math.min(100, Math.max(0, number));

      function render() {
        const rounded = Math.round(position);
        compare.style.setProperty('--pos', `${position}%`);
        handle.setAttribute('aria-valuenow', String(rounded));
        handle.setAttribute('aria-valuetext', `${rounded} percent edited image visible`);
        value.textContent = `${rounded}%`;
      }

      function setFromClientX(clientX) {
        const rect = compare.getBoundingClientRect();
        position = clamp(((clientX - rect.left) / rect.width) * 100);
        render();
      }

      compare.addEventListener('pointerdown', (event) => {
        dragging = true;
        compare.setPointerCapture(event.pointerId);
        setFromClientX(event.clientX);
        handle.focus({ preventScroll: true });
      });

      compare.addEventListener('pointermove', (event) => {
        if (dragging) setFromClientX(event.clientX);
      });

      const stopDragging = () => { dragging = false; };
      compare.addEventListener('pointerup', stopDragging);
      compare.addEventListener('pointercancel', stopDragging);

      handle.addEventListener('keydown', (event) => {
        const step = event.shiftKey ? 10 : 2;
        let next = position;

        if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') next = position - step;
        else if (event.key === 'ArrowRight' || event.key === 'ArrowUp') next = position + step;
        else if (event.key === 'PageDown') next = position - 10;
        else if (event.key === 'PageUp') next = position + 10;
        else if (event.key === 'Home') next = 0;
        else if (event.key === 'End') next = 100;
        else return;

        event.preventDefault();
        position = clamp(next);
        render();
      });

      render();
    })();
  </script>
</body>
</html>
