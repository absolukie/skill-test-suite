<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A/B Hero Headline Comparison</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #211d18;
      --muted: #776f64;
      --paper: #f7f2ea;
      --card: #fffdf8;
      --line: #ddd2c2;
      --thumb: #2a241d;
      --accent: #a44a24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-system, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .ab {
      width: min(100%, 680px);
    }

    .switch {
      appearance: none;
      position: relative;
      display: block;
      width: min(100%, 420px);
      height: 58px;
      margin: 0 auto 18px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #eee7da;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .switch:focus-visible {
      outline: 3px solid rgba(164, 74, 36, .42);
      outline-offset: 3px;
    }

    .thumb {
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 5px;
      width: calc(50% - 5px);
      border-radius: 999px;
      background: var(--thumb);
      transition: left 280ms cubic-bezier(.5, 0, .2, 1.15);
    }

    .ab.flipped .thumb {
      left: 50%;
    }

    .labels {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100%;
    }

    .label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding-inline: 18px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      color: var(--muted);
      transition: color 280ms ease;
      white-space: nowrap;
    }

    .label.is-active {
      color: #fffaf2;
    }

    .stage {
      position: relative;
      min-height: 290px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(54, 42, 28, .10);
    }

    .layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(26px, 6vw, 52px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 450ms ease;
    }

    .layer.is-shown {
      opacity: 1;
      pointer-events: auto;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 560px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 8vw, 68px);
      line-height: .98;
      letter-spacing: -.035em;
    }

    .description {
      margin: 18px 0 0;
      max-width: 520px;
      color: var(--muted);
      font-size: clamp(17px, 3.5vw, 20px);
      line-height: 1.45;
    }

    @media (prefers-reduced-motion: reduce) {
      .thumb,
      .label,
      .layer {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="ab" id="hero-ab">
    <button class="switch" type="button" role="switch" aria-checked="false" aria-label="Flip between Coffee, delivered weekly and Never run out of beans">
      <span class="thumb" aria-hidden="true"></span>
      <span class="labels" aria-hidden="true">
        <span class="label label-a is-active">A</span>
        <span class="label label-b">B</span>
      </span>
    </button>

    <section class="stage" aria-live="polite">
      <article class="layer va is-shown">
        <p class="eyebrow">Version A</p>
        <h1>Coffee, delivered weekly</h1>
        <p class="description">A standing weekly delivery for people who like the ritual handled.</p>
      </article>

      <article class="layer vb" aria-hidden="true">
        <p class="eyebrow">Version B</p>
        <h1>Never run out of beans</h1>
        <p class="description">A backup-aware plan that refills before the last scoop disappears.</p>
      </article>
    </section>
  </main>

  <script>
    function initABToggle(root) {
      const button = root.querySelector('[role="switch"]');
      const labels = root.querySelectorAll('.label');
      const layers = root.querySelectorAll('.layer');
      let showingB = false;

      function render() {
        root.classList.toggle('flipped', showingB);
        button.setAttribute('aria-checked', String(showingB));

        labels.forEach((label, index) => {
          label.classList.toggle('is-active', index === (showingB ? 1 : 0));
        });

        layers.forEach((layer, index) => {
          const shown = index === (showingB ? 1 : 0);
          layer.classList.toggle('is-shown', shown);
          if (shown) {
            layer.removeAttribute('aria-hidden');
          } else {
            layer.setAttribute('aria-hidden', 'true');
          }
        });
      }

      button.addEventListener('click', () => {
        showingB = !showingB;
        render();
      });

      render();
    }

    initABToggle(document.getElementById('hero-ab'));
  </script>
</body>
</html>
