<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A/B Toggle: Coffee Headlines</title>
<style>
  :root {
    color-scheme: light;
    --ink: #241f18;
    --muted: #776f61;
    --track: #e9e2d3;
    --thumb: #262019;
    --paper: #fffaf0;
    --line: #d8cdb8;
    --accent: #9a5a24;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 18px;
    background: #f4ead8;
    color: var(--ink);
    font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    width: min(100%, 760px);
  }

  .eyebrow {
    margin: 0 0 10px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .intro {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.5;
  }

  [data-ab-toggle] {
    width: 100%;
  }

  .ab-switch {
    position: relative;
    display: block;
    width: min(100%, 420px);
    height: 58px;
    margin: 0 auto;
    padding: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--track);
    color: var(--ink);
    cursor: pointer;
    font: inherit;
    touch-action: manipulation;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .65), 0 10px 24px rgba(66, 47, 20, .12);
  }

  .ab-switch:focus-visible {
    outline: 3px solid rgba(154, 90, 36, .45);
    outline-offset: 4px;
  }

  .ab-switch .thumb {
    position: absolute;
    top: 5px;
    bottom: 5px;
    left: 5px;
    width: calc(50% - 5px);
    border-radius: 999px;
    background: var(--thumb);
    transition: left 280ms cubic-bezier(.5, 0, .2, 1.15);
  }

  [data-ab-toggle][data-state="b"] .ab-switch .thumb {
    left: 50%;
  }

  .ab-switch .labels {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100%;
  }

  .ab-switch .side-label {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding-inline: 16px;
    font-size: 16px;
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
    color: var(--muted);
    transition: color 280ms ease;
  }

  [data-ab-toggle][data-state="a"] .side-label-a,
  [data-ab-toggle][data-state="b"] .side-label-b {
    color: #fff8ea;
  }

  .stage {
    position: relative;
    min-height: 258px;
    margin-top: 20px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 28px;
    background: var(--paper);
    box-shadow: 0 22px 50px rgba(66, 47, 20, .14);
  }

  .stage .va,
  .stage .vb {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(26px, 6vw, 54px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 450ms ease;
  }

  [data-ab-toggle][data-state="a"] .stage .va,
  [data-ab-toggle][data-state="b"] .stage .vb {
    opacity: 1;
    pointer-events: auto;
  }

  .version-tag {
    width: fit-content;
    margin: 0 0 16px;
    padding: 7px 11px;
    border-radius: 999px;
    background: #f0dfc4;
    color: var(--accent);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    max-width: 620px;
    font-size: clamp(38px, 8vw, 68px);
    line-height: .98;
    letter-spacing: -.045em;
  }

  .description {
    max-width: 560px;
    margin: 18px 0 0;
    color: var(--muted);
    font-size: clamp(17px, 3.5vw, 21px);
    line-height: 1.45;
  }

  @media (max-width: 430px) {
    body { padding-inline: 14px; }
    .ab-switch { height: 56px; }
    .ab-switch .side-label {
      padding-inline: 14px;
      font-size: 16px;
    }
    .stage { min-height: 282px; border-radius: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ab-switch .thumb,
    .ab-switch .side-label,
    .stage .va,
    .stage .vb {
      transition: none;
    }
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Hero headline test</p>
    <p class="intro">Tap the switch to flip the comparison. Every tap changes sides.</p>

    <section data-ab-toggle data-state="a" aria-label="A/B headline comparison">
      <button class="ab-switch" type="button" role="switch" aria-checked="false" aria-label="Flip between Coffee, delivered weekly and Never run out of beans">
        <span class="thumb" aria-hidden="true"></span>
        <span class="labels" aria-hidden="true">
          <span class="side-label side-label-a">Version A</span>
          <span class="side-label side-label-b">Version B</span>
        </span>
      </button>

      <div class="stage" aria-live="polite">
        <article class="va">
          <p class="version-tag">Version A</p>
          <h1>Coffee, delivered weekly</h1>
          <p class="description">Fresh beans land on your doorstep every week, timed to the way you brew.</p>
        </article>

        <article class="vb">
          <p class="version-tag">Version B</p>
          <h1>Never run out of beans</h1>
          <p class="description">Smart refills track your pace and ship before the bag hits empty.</p>
        </article>
      </div>
    </section>
  </main>

<script>
  function initAbToggle(root) {
    var button = root.querySelector('.ab-switch');

    if (!button) {
      return;
    }

    button.addEventListener('click', function () {
      var showingB = root.getAttribute('data-state') === 'b';
      var nextState = showingB ? 'a' : 'b';

      root.setAttribute('data-state', nextState);
      button.setAttribute('aria-checked', nextState === 'b' ? 'true' : 'false');
    });
  }

  document.querySelectorAll('[data-ab-toggle]').forEach(initAbToggle);
</script>
</body>
</html>
