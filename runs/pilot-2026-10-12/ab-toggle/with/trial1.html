<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Headline A/B Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f1ea;
    font-family: Georgia, 'Times New Roman', serif;
    color: #2b2118;
    padding: 24px 16px;
  }
  .ab-toggle {
    width: 100%;
    max-width: 420px;
  }
  .ab-toggle .switch {
    position: relative;
    display: block;
    width: 100%;
    height: 56px;
    padding: 0;
    border: 2px solid #2b2118;
    border-radius: 999px;
    background: #e7dfcf;
    cursor: pointer;
    touch-action: manipulation;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .ab-toggle .switch:focus-visible {
    outline: 3px solid #b3541e;
    outline-offset: 3px;
  }
  .ab-toggle .thumb {
    position: absolute;
    top: 5px;
    left: 5px;
    width: calc(50% - 5px);
    height: calc(100% - 10px);
    border-radius: 999px;
    background: #2b2118;
    transition: left 280ms cubic-bezier(.5, 0, .2, 1.15);
  }
  .ab-toggle.show-b .thumb {
    left: 50%;
  }
  .ab-toggle .labels {
    position: absolute;
    inset: 0;
    display: flex;
  }
  .ab-toggle .label {
    flex: 1 1 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: .04em;
    color: #7a6a55;
    transition: color 280ms ease;
    z-index: 1;
  }
  .ab-toggle .label-a { color: #f7f2e7; }
  .ab-toggle.show-b .label-a { color: #7a6a55; }
  .ab-toggle.show-b .label-b { color: #f7f2e7; }
  .ab-toggle .stage {
    position: relative;
    margin-top: 20px;
    min-height: 190px;
    border: 2px solid #2b2118;
    border-radius: 16px;
    background: #fffdf7;
    overflow: hidden;
  }
  .ab-toggle .va,
  .ab-toggle .vb {
    position: absolute;
    inset: 0;
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: opacity 450ms ease;
  }
  .ab-toggle .va { opacity: 1; }
  .ab-toggle .vb { opacity: 0; pointer-events: none; }
  .ab-toggle.show-b .va { opacity: 0; pointer-events: none; }
  .ab-toggle.show-b .vb { opacity: 1; pointer-events: auto; }
  .ab-toggle .stage h1 {
    margin: 0 0 12px;
    font-size: 32px;
    line-height: 1.15;
  }
  .ab-toggle .stage p {
    margin: 0;
    font-size: 17px;
    line-height: 1.45;
    color: #5d4c38;
  }
  @media (prefers-reduced-motion: reduce) {
    .ab-toggle .thumb,
    .ab-toggle .label,
    .ab-toggle .va,
    .ab-toggle .vb {
      transition: none;
    }
  }
</style>
</head>
<body>

<div class="ab-toggle" id="hero-ab">
  <button class="switch" type="button" role="switch" aria-checked="false" aria-label="Flip between Coffee, delivered weekly and Never run out of beans">
    <span class="thumb" aria-hidden="true"></span>
    <span class="labels" aria-hidden="true">
      <span class="label label-a">A</span>
      <span class="label label-b">B</span>
    </span>
  </button>
  <div class="stage">
    <div class="va">
      <h1>Coffee, delivered weekly</h1>
      <p>Fresh-roasted beans land on your doorstep every week, right on schedule.</p>
    </div>
    <div class="vb">
      <h1>Never run out of beans</h1>
      <p>We keep an eye on your supply and ship a fresh bag before the last one runs dry.</p>
    </div>
  </div>
</div>

<script>
function initAbToggle(root) {
  var button = root.querySelector('.switch');
  button.addEventListener('click', function () {
    var showB = root.classList.toggle('show-b');
    button.setAttribute('aria-checked', showB ? 'true' : 'false');
  });
}
initAbToggle(document.getElementById('hero-ab'));
</script>

</body>
</html>
