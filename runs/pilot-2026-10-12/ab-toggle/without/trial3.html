<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Headline A/B Comparison</title>
<style>
  :root {
    --bg: #faf7f2;
    --ink: #1e1b16;
    --muted: #6b6257;
    --accent: #8a5a2b;
    --accent-soft: #e9dcc8;
    --card: #ffffff;
    --border: #ddd3c2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 64px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1.page-title {
    font-size: 15px;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 24px;
  }
  /* Toggle */
  .toggle-row { display: flex; justify-content: center; margin-bottom: 28px; }
  .toggle {
    display: inline-flex;
    position: relative;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    cursor: pointer;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle .thumb {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    background: var(--card);
    border-radius: 999px;
    box-shadow: 0 1px 4px rgba(30, 27, 22, 0.18);
    transition: transform 0.25s ease;
  }
  .toggle[data-active="b"] .thumb { transform: translateX(100%); }
  .toggle button {
    position: relative;
    z-index: 1;
    border: none;
    background: transparent;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    padding: 9px 30px;
    border-radius: 999px;
    cursor: pointer;
    min-width: 110px;
  }
  .toggle button[aria-pressed="true"] { color: var(--ink); }
  .toggle button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  /* Stage */
  .stage {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 56px 40px 48px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(30, 27, 22, 0.05);
  }
  .stage .variant-tag {
    display: inline-block;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 4px 12px;
    margin-bottom: 20px;
  }
  .stage h2 {
    font-size: 38px;
    line-height: 1.15;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .stage p {
    font-size: 17px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 420px;
    margin: 0 auto;
  }
  .stage .content { transition: opacity 0.18s ease; }
  .stage .content.fading { opacity: 0; }
  @media (max-width: 480px) {
    .stage { padding: 40px 24px 36px; }
    .stage h2 { font-size: 30px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="page-title">Hero Headline &mdash; A/B Comparison</h1>

    <div class="toggle-row">
      <div class="toggle" id="toggle" data-active="a" role="group" aria-label="Choose headline version">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" id="btnA" aria-pressed="true">Version A</button>
        <button type="button" id="btnB" aria-pressed="false">Version B</button>
      </div>
    </div>

    <section class="stage" aria-live="polite">
      <div class="content" id="content">
        <span class="variant-tag" id="variantTag">Version A</span>
        <h2 id="headline">Coffee, delivered weekly</h2>
        <p id="description">Fresh-roasted beans arrive on your schedule, so every morning starts with a great cup.</p>
      </div>
    </section>
  </div>

<script>
  (function () {
    var versions = {
      a: {
        tag: 'Version A',
        headline: 'Coffee, delivered weekly',
        description: 'Fresh-roasted beans arrive on your schedule, so every morning starts with a great cup.'
      },
      b: {
        tag: 'Version B',
        headline: 'Never run out of beans',
        description: 'We track your pace and ship just before you run low, keeping your shelf stocked without the guesswork.'
      }
    };

    var toggle = document.getElementById('toggle');
    var btnA = document.getElementById('btnA');
    var btnB = document.getElementById('btnB');
    var content = document.getElementById('content');
    var variantTag = document.getElementById('variantTag');
    var headline = document.getElementById('headline');
    var description = document.getElementById('description');
    var current = 'a';
    var timer = null;

    function show(key) {
      if (key === current) return;
      current = key;
      toggle.setAttribute('data-active', key);
      btnA.setAttribute('aria-pressed', key === 'a' ? 'true' : 'false');
      btnB.setAttribute('aria-pressed', key === 'b' ? 'true' : 'false');
      content.classList.add('fading');
      clearTimeout(timer);
      timer = setTimeout(function () {
        variantTag.textContent = versions[key].tag;
        headline.textContent = versions[key].headline;
        description.textContent = versions[key].description;
        content.classList.remove('fading');
      }, 180);
    }

    btnA.addEventListener('click', function () { show('a'); });
    btnB.addEventListener('click', function () { show('b'); });
  })();
</script>
</body>
</html>
