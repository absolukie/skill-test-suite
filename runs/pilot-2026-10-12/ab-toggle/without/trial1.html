<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A/B Headline Comparison</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #22201d;
    --muted: #6f6a61;
    --accent: #8a5a2b;
    --accent-soft: #efe6da;
    --line: #e3ddd2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .ab-compare {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }
  .ab-eyebrow {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }

  /* Toggle */
  .ab-toggle {
    position: relative;
    display: inline-flex;
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 28px;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .ab-toggle button {
    position: relative;
    z-index: 1;
    appearance: none;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    padding: 10px 26px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.25s ease;
    min-width: 120px;
  }
  .ab-toggle button[aria-pressed="true"] { color: #fff; }
  .ab-toggle button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .ab-thumb {
    position: absolute;
    top: 4px;
    left: 4px;
    height: calc(100% - 8px);
    background: var(--accent);
    border-radius: 999px;
    transition: transform 0.3s cubic-bezier(.4, 0, .2, 1), width 0.3s cubic-bezier(.4, 0, .2, 1);
    z-index: 0;
  }

  /* Stage */
  .ab-stage {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 56px 32px 48px;
    box-shadow: 0 10px 30px rgba(60, 45, 25, 0.08);
  }
  .ab-variant {
    display: inline-block;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 5px 12px;
    margin-bottom: 20px;
  }
  .ab-headline {
    font-size: clamp(34px, 7vw, 52px);
    line-height: 1.12;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .ab-desc {
    font-size: 18px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 42ch;
    margin: 0 auto;
  }
  .ab-content {
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .ab-content.fading {
    opacity: 0;
    transform: translateY(6px);
  }
</style>
</head>
<body>

  <main class="ab-compare">
    <p class="ab-eyebrow">Hero Headline Test</p>

    <div class="ab-toggle" role="group" aria-label="Choose headline version">
      <span class="ab-thumb" id="abThumb" aria-hidden="true"></span>
      <button type="button" id="btnA" aria-pressed="true">Version A</button>
      <button type="button" id="btnB" aria-pressed="false">Version B</button>
    </div>

    <section class="ab-stage" aria-live="polite">
      <div class="ab-content" id="abContent">
        <span class="ab-variant" id="abVariant">Version A</span>
        <h1 class="ab-headline" id="abHeadline">Coffee, delivered weekly</h1>
        <p class="ab-desc" id="abDesc">Fresh-roasted beans arrive on your schedule, every single week.</p>
      </div>
    </section>
  </main>

<script>
  (function () {
    var versions = {
      A: {
        label: "Version A",
        headline: "Coffee, delivered weekly",
        desc: "Fresh-roasted beans arrive on your schedule, every single week."
      },
      B: {
        label: "Version B",
        headline: "Never run out of beans",
        desc: "We track your supply and ship the next bag before the last one runs dry."
      }
    };

    var btnA = document.getElementById('btnA');
    var btnB = document.getElementById('btnB');
    var thumb = document.getElementById('abThumb');
    var content = document.getElementById('abContent');
    var variantEl = document.getElementById('abVariant');
    var headlineEl = document.getElementById('abHeadline');
    var descEl = document.getElementById('abDesc');
    var current = 'A';

    function placeThumb() {
      var active = current === 'A' ? btnA : btnB;
      thumb.style.width = active.offsetWidth + 'px';
      thumb.style.transform = 'translateX(' + (active.offsetLeft - 4) + 'px)';
    }

    function show(version) {
      if (version === current) { placeThumb(); return; }
      current = version;
      btnA.setAttribute('aria-pressed', version === 'A' ? 'true' : 'false');
      btnB.setAttribute('aria-pressed', version === 'B' ? 'true' : 'false');
      placeThumb();
      content.classList.add('fading');
      setTimeout(function () {
        variantEl.textContent = versions[version].label;
        headlineEl.textContent = versions[version].headline;
        descEl.textContent = versions[version].desc;
        content.classList.remove('fading');
      }, 180);
    }

    btnA.addEventListener('click', function () { show('A'); });
    btnB.addEventListener('click', function () { show('B'); });
    window.addEventListener('resize', placeThumb);

    placeThumb();
  })();
</script>

</body>
</html>
